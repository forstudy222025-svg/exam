{% extends 'base.html' %}
{% block content %}
<h1>Login</h1>
<form method="post" class="auth-form">{% csrf_token %}
  {% if form.non_field_errors %}
    <div class="form-errors">{{ form.non_field_errors }}</div>
  {% endif %}
  {{ form.as_p }}
  <button type="submit">Login</button>
  <input type="hidden" name="next" value="{{ next }}">
</form>
{% endblock %}
